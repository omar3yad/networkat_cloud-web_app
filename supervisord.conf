[supervisord]
nodaemon=true
# Run supervisord as the non-root app user, not root.
# This means every child process it spawns (gunicorn, uvicorn) also runs
# as appuser, so any files they create are owned by appuser:devteam.
# umask=002 → new files get mode 664 (rw-rw-r--) and new dirs 775.
# This guarantees group-write access for all devteam members without
# any manual chmod after the fact.
umask=002
logfile=/dev/null
logfile_maxbytes=0
# /var/run requires root; /tmp is world-writable so appuser can write here.
pidfile=/tmp/supervisord.pid

# ── Flask admin app (port 5000) ──────────────────────────────────────────────
[program:admin]
command=gunicorn app:app --bind 0.0.0.0:5000 --workers 2 --timeout 60 --reload --access-logfile - --error-logfile -
directory=/app
environment=FLASK_APP="app.py",SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Flask client app (port 8097) ─────────────────────────────────────────────
# ── Flask client app (port 8097) ─────────────────────────────────────────────
[program:client]
command=gunicorn client_app:app --bind 0.0.0.0:8097 --workers 2 --threads 4 --timeout 0 --reload --access-logfile - --error-logfile -
directory=/app
environment=FLASK_APP="client_app.py",SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# ── FastAPI app via uvicorn (port  8098) ──────────────────────────────────────
[program:api]
# Multi-line command must be on a single line for supervisord to parse correctly.
command=uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8098 --reload --reload-dir /app/fastapi_app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
