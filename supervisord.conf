[supervisord]
nodaemon=true
# Run supervisord as the non-root app user, not root.
# This means every child process it spawns (gunicorn, uvicorn) also runs
# as appuser, so any files they create are owned by appuser:devteam.
# umask=002 → new files get mode 664 (rw-rw-r--) and new dirs 775.
# This guarantees group-write access for all devteam members without
# any manual chmod after the fact.
umask=002
logfile=/dev/null
logfile_maxbytes=0
# /var/run requires root; /tmp is world-writable so appuser can write here.
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


# ── Flask admin app (port 5000) ──────────────────────────────────────────────
[program:admin]
command=gunicorn app:app --bind 0.0.0.0:5000 --workers 2 --timeout 60 --reload --access-logfile - --error-logfile -
directory=/app
environment=FLASK_APP="app.py",SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Flask client app (port 8097) ─────────────────────────────────────────────
# ── Flask client app (port 8097) ─────────────────────────────────────────────
[program:client]
command=gunicorn client_app:app --bind 0.0.0.0:8097 --workers 2 --threads 4 --timeout 0 --reload --access-logfile - --error-logfile -
directory=/app
environment=FLASK_APP="client_app.py",SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s",FLASK_SECRET_KEY="%(ENV_FLASK_SECRET_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# ── FastAPI app via uvicorn (port  8098) ──────────────────────────────────────
[program:api]
# Multi-line command must be on a single line for supervisord to parse correctly.
command=uvicorn fastapi_app.main:app --host 0.0.0.0 --port 8098 --reload --reload-dir /app/fastapi_app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Controller→peer heartbeat job (no port) ──────────────────────────────────
# Pings POST /heartbeat on every connected peer's agent every ~60s so the
# peer-side failsafe / dead-man-switch has a reliable liveness signal that
# doesn't depend on a customer having the dashboard open. Pure background
# loop, no request serving. See scheduler/peers_heartbeat.py for the full
# rationale.
# -u: unbuffered, so the summary lines reach the container log immediately.
[program:heartbeat]
command=python -u -m scheduler.peers_heartbeat
directory=/app
autostart=true
autorestart=true
# It exits 0 on SIGTERM; a nonzero exit is a real crash worth restarting.
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Subscription lifecycle checker job (no port) ─────────────────────────────
# Periodically checks client renewal dates, sends 3-day reminder emails,
# and enforces state machine transitions (grace_period, limit_control, inactive).
[program:subscription_checker]
command=python -u -m scheduler.subscription_checker
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

