<!-- Unified Admin Sidebar Component -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<aside class="sidebar" id="admin-sidebar" aria-label="Admin Navigation">
    <div class="sidebar-header">
        <div class="sidebar-header-top">
            <a href="/dashboard" class="sidebar-logo-wrap" title="Networkat Dashboard">
                <img src="/static/logoW.png" alt="Networkat" class="sidebar-logo-img"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                <span class="sidebar-logo-fallback" style="display:none; font-weight:700; font-size:1.15rem; color:#ffffff; letter-spacing:0.3px;">Networkat</span>
            </a>
            <button type="button" class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close navigation">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <p class="sidebar-subtitle">Management portal</p>
    </div>

    <nav class="nav-menu">
        <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <i class="fas fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>

        <a href="/customers" class="nav-item {% if active_page in ['customers', 'customer_details'] %}active{% endif %}">
            <i class="fas fa-building"></i>
            <span>Customers</span>
        </a>

        {% if session.get('admin_role') == 'admin' %}
        <a href="/plans" class="nav-item {% if active_page == 'plans' %}active{% endif %}">
            <i class="fas fa-layer-group"></i>
            <span>Subscription plans</span>
        </a>

        <a href="/staff" class="nav-item {% if active_page == 'staff' %}active{% endif %}">
            <i class="fas fa-users-cog"></i>
            <span>Staff &amp; Roles</span>
        </a>

        <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
            <i class="fas fa-sliders-h"></i>
            <span>System Settings</span>
        </a>
        {% endif %}

        <div class="nav-divider"></div>

        <a href="/logout" class="nav-item nav-item-logout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Sign out</span>
        </a>
    </nav>
</aside>

<style>
    /* Unified Admin Sidebar Styles */
    :root {
        --sb-bg: #1e2a41;
        --sb-hover: #2d3a55;
        --sb-active: #0078d4;
        --sb-border: rgba(255, 255, 255, 0.08);
        --sb-text: rgba(255, 255, 255, 0.78);
        --sb-text-muted: rgba(255, 255, 255, 0.45);
        --sb-width: 260px;
    }

    .sidebar {
        width: var(--sb-width);
        background: var(--sb-bg);
        color: #ffffff;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 1050;
        display: flex;
        flex-direction: column;
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
    }

    .sidebar-header {
        padding: 1.35rem 1.4rem 1.1rem;
        border-bottom: 1px solid var(--sb-border);
        flex-shrink: 0;
    }

    .sidebar-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 28px;
    }

    .sidebar-logo-wrap {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
    }

    .sidebar-logo-img {
        height: 24px;
        width: auto;
        vertical-align: middle;
        object-fit: contain;
    }

    .sidebar-subtitle {
        color: var(--sb-text-muted);
        font-size: 0.8rem;
        margin-top: 0.45rem;
        margin-bottom: 0;
        font-weight: 400;
        letter-spacing: 0.2px;
    }

    .sidebar-close-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        background: rgba(255, 255, 255, 0.08);
        border: none;
        border-radius: 6px;
        color: #ffffff;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
    }

    .sidebar-close-btn:hover {
        background: rgba(255, 255, 255, 0.18);
    }

    .nav-menu {
        padding: 0.85rem 0;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .nav-item {
        padding: 0.72rem 1.4rem;
        display: flex;
        align-items: center;
        gap: 0.95rem;
        color: var(--sb-text);
        text-decoration: none;
        font-size: 0.92rem;
        font-weight: 500;
        transition: background 0.2s ease, color 0.2s ease, border-left-color 0.2s ease;
        border-left: 3px solid transparent;
        line-height: 1.4;
    }

    .nav-item:hover {
        background: var(--sb-hover);
        color: #ffffff;
        border-left-color: var(--sb-active);
    }

    .nav-item.active {
        background: var(--sb-hover);
        color: #ffffff;
        border-left-color: var(--sb-active);
        font-weight: 600;
    }

    .nav-item i {
        width: 18px;
        font-size: 1.05rem;
        text-align: center;
        flex-shrink: 0;
        opacity: 0.88;
    }

    .nav-item.active i {
        opacity: 1;
        color: #60a5fa;
    }

    .nav-item span {
        flex: 1;
    }

    .nav-divider {
        height: 1px;
        background: var(--sb-border);
        margin: 0.75rem 0;
        flex-shrink: 0;
    }

    .nav-item-logout {
        margin-top: auto;
        color: rgba(248, 113, 113, 0.85);
    }

    .nav-item-logout:hover {
        color: #f87171;
        border-left-color: #ef4444;
    }

    /* Sidebar Overlay (Backdrop for mobile) */
    .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        z-index: 1040;
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .sidebar-overlay.active {
        display: block;
        opacity: 1;
    }

    /* Mobile menu button */
    .mobile-menu-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        color: #1e293b;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        flex-shrink: 0;
        margin-right: 0.75rem;
    }

    .mobile-menu-btn:hover {
        background: #f1f5f9;
        color: #0078d4;
        border-color: #0078d4;
    }

    /* Mobile drawer behavior */
    @media (max-width: 991px) {
        .sidebar {
            transform: translateX(-100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-close-btn {
            display: inline-flex;
        }

        .mobile-menu-btn {
            display: inline-flex;
        }

        .main-content {
            margin-left: 0 !important;
            width: 100% !important;
        }
    }

    @media (min-width: 992px) {
        .sidebar {
            transform: translateX(0) !important;
        }

        .sidebar-overlay {
            display: none !important;
        }

        .sidebar-close-btn {
            display: none !important;
        }

        .main-content {
            margin-left: var(--sb-width);
            min-height: 100vh;
        }
    }
</style>

<script>
    (function initAdminSidebar() {
        function setup() {
            const sidebar = document.getElementById('admin-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const menuToggle = document.getElementById('mobile-menu-toggle');
            const closeBtn = document.getElementById('sidebar-close-btn');

            if (!sidebar || !overlay) return;

            function openSidebar() {
                sidebar.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            if (menuToggle && !menuToggle.dataset.sidebarBound) {
                menuToggle.dataset.sidebarBound = 'true';
                menuToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (sidebar.classList.contains('open')) {
                        closeSidebar();
                    } else {
                        openSidebar();
                    }
                });
            }

            if (closeBtn && !closeBtn.dataset.sidebarBound) {
                closeBtn.dataset.sidebarBound = 'true';
                closeBtn.addEventListener('click', closeSidebar);
            }

            if (!overlay.dataset.sidebarBound) {
                overlay.dataset.sidebarBound = 'true';
                overlay.addEventListener('click', closeSidebar);
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            sidebar.querySelectorAll('.nav-item').forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth < 992) {
                        closeSidebar();
                    }
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setup);
        } else {
            setup();
        }
    })();
</script>
